on:
  push:
    branches:
      - master
    paths:
      - "package.json"

name: Create Release if version is bumped
jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false
      - run: git fetch --prune --unshallow --tags
      - uses: kanga333/config-value-exporter@main
        id: version
        with:
          key: version
          file: package.json
      - id: tag_check
        run: |
          git rev-parse v${STEPS_VERSION_OUTPUTS_RESULT} 2> /dev/null \
            || echo 'exist=false' >> $GITHUB_OUTPUT
        env:
          STEPS_VERSION_OUTPUTS_RESULT: ${{steps.version.outputs.result}}
      - name: Create Release
        if: steps.tag_check.outputs.exist == 'false'
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{steps.version.outputs.result}}
          release_name: Release v${{steps.version.outputs.result}}
          draft: false
          prerelease: false
